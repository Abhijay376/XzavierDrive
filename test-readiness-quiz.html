<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VicRoads Test Readiness Quiz | TestPass Driving Academy</title>
<meta name="description" content="Take our free 8-question quiz to see if you're ready for your VicRoads driving test, and get a personalised lesson recommendation.">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111827;background:#fff;line-height:1.6}
.header{background:#fff;box-shadow:0 2px 15px rgba(0,0,0,.08);position:fixed;width:100%;top:0;z-index:1000}
.nav-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;height:70px}
.logo{font-size:20px;font-weight:800;color:#0f172a;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{color:#dc2626}
.wa-btn{background:#25D366;color:#fff;padding:11px 20px;border-radius:8px;font-weight:700;text-decoration:none;font-size:.88rem;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer}
.container{max-width:800px;margin:0 auto;padding:0 20px}
.page-hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:110px 0 50px;text-align:center}
.page-hero h1{font-size:2.2rem;font-weight:800;margin-bottom:14px}
.page-hero p{opacity:.9;max-width:560px;margin:0 auto}
.quiz-section{padding:50px 0}
.quiz-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:36px}
.progress-bar{height:8px;background:#e2e8f0;border-radius:6px;margin-bottom:26px;overflow:hidden}
.progress-fill{height:100%;background:#dc2626;border-radius:6px;transition:width .3s ease;width:12.5%}
.quiz-progress{font-size:.85rem;color:#888;margin-bottom:12px}
.quiz-q{font-size:1.15rem;font-weight:700;color:#0f172a;margin-bottom:20px}
.quiz-options{display:flex;flex-direction:column;gap:12px}
.quiz-options button{padding:15px;border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;cursor:pointer;font-size:.95rem;text-align:left}
.quiz-options button:hover{border-color:#dc2626;background:#fef2f2}
.result-box{display:none;padding:26px;border-radius:14px;text-align:center}
.result-box.show{display:block}
.result-good{background:#dcfce7;border:1px solid #86efac}
.result-mid{background:#fef3c7;border:1px solid #fcd34d}
.result-more{background:#fee2e2;border:1px solid #fca5a5}
.result-box h3{font-size:1.4rem;margin-bottom:10px;color:#0f172a}
.result-box p{color:#444;margin-bottom:18px}
.weak-spots{text-align:left;background:#fff;border-radius:10px;padding:16px;margin-bottom:18px}
.weak-spots li{padding:6px 0;font-size:.9rem;color:#555}
.footer{background:#0f172a;color:#94a3b8;padding:30px 0;text-align:center;font-size:.85rem}
@media(max-width:600px){.page-hero h1{font-size:1.6rem}}
</style>
</head>
<body>
<header class="header">
  <div class="nav-container">
    <a href="/" class="logo"><i class="fas fa-steering-wheel"></i> TestPass Driving Academy</a>
    <a href="https://wa.me/61400000000" class="wa-btn"><i class="fab fa-whatsapp"></i> WhatsApp Us</a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Are You Ready for Your VicRoads Test?</h1>
    <p>8 quick questions. Get your weak spots and a personalised lesson recommendation at the end.</p>
  </div>
</section>

<section class="quiz-section">
  <div class="container">
    <div class="quiz-card">
      <div id="quizArea">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="quiz-progress" id="quizProgress">Question 1 of 8</div>
        <div class="quiz-q" id="quizQuestion">How confident are you with parallel parking?</div>
        <div class="quiz-options" id="quizOptions">
          <button onclick="answerQuiz(0)">Very confident — I can do it consistently</button>
          <button onclick="answerQuiz(1)">Somewhat — I sometimes need extra attempts</button>
          <button onclick="answerQuiz(2)">Not confident — I avoid it if I can</button>
        </div>
      </div>
      <div class="result-box" id="resultBox"></div>
    </div>
  </div>
</section>

<footer class="footer">© 2026 TestPass Driving Academy</footer>

<script>
let quizStep=0, quizScore=0, weakAreas=[];
const quizQuestions=[
  {q:'How confident are you with parallel parking?',opts:['Very confident — consistent','Somewhat — need extra attempts','Not confident — I avoid it'],area:'Parallel parking'},
  {q:'How comfortable are you at multi-lane roundabouts?',opts:['Very confident','Somewhat','Not confident'],area:'Roundabouts'},
  {q:'How many supervised driving hours have you completed?',opts:['20+ hours','10-20 hours','Under 10 hours'],area:'Overall hours'},
  {q:'How confident are you merging onto highways?',opts:['Very confident','Somewhat','Not confident'],area:'Highway merging'},
  {q:'How consistently do you check mirrors and blind spots?',opts:['Every time, automatically','Most of the time','I often forget'],area:'Observation checks'},
  {q:'How do you handle giving way at intersections?',opts:['Always correct','Sometimes hesitant or unsure','Often confused'],area:'Give way rules'},
  {q:'Have you practiced on your actual test route?',opts:['Yes, several times','Once or twice','Not yet'],area:'Test route familiarity'},
  {q:'How do you feel about your overall test readiness?',opts:['Ready to book','Getting there','Still nervous'],area:'Overall confidence'}
];
function answerQuiz(idx){
  quizScore += idx;
  if(idx>=1) weakAreas.push(quizQuestions[quizStep].area);
  quizStep++;
  document.getElementById('progressFill').style.width = ((quizStep/quizQuestions.length)*100)+'%';
  if(quizStep < quizQuestions.length){
    document.getElementById('quizProgress').textContent = 'Question '+(quizStep+1)+' of '+quizQuestions.length;
    document.getElementById('quizQuestion').textContent = quizQuestions[quizStep].q;
    const opts = quizQuestions[quizStep].opts;
    document.getElementById('quizOptions').innerHTML = opts.map((o,i)=>'<button onclick="answerQuiz('+i+')">'+o+'</button>').join('');
  } else {
    document.getElementById('quizArea').style.display='none';
    const box = document.getElementById('resultBox');
    box.classList.add('show');
    let cls, title, desc, lessons;
    if(quizScore <= 5){ cls='result-good'; title='You look test-ready'; desc='A short top-up focused on your test route would be a great final step.'; lessons='1-2 lessons recommended'; }
    else if(quizScore <= 11){ cls='result-mid'; title='Getting there'; desc='A few targeted lessons on your weaker areas will get you test-ready.'; lessons='5 lessons recommended'; }
    else { cls='result-more'; title='More practice needed'; desc='Building core confidence first will make a big difference on test day.'; lessons='10+ lessons recommended'; }
    box.className='result-box show '+cls;
    const areasList = [...new Set(weakAreas)].slice(0,3).map(a=>'<li><i class="fas fa-circle-exclamation" style="color:#dc2626"></i> '+a+'</li>').join('');
    box.innerHTML = '<h3>'+title+'</h3><p>'+desc+'</p>'+(areasList?'<div class="weak-spots"><strong>Areas to focus on:</strong><ul>'+areasList+'</ul></div>':'')+'<p><strong>'+lessons+'</strong></p><a href="https://wa.me/61400000000?text=Hi,%20I%20just%20did%20the%20readiness%20quiz%20and%20want%20to%20book%20lessons" class="wa-btn"><i class="fab fa-whatsapp"></i> Book on WhatsApp</a>';
  }
}
</script>
</body>
</html>
